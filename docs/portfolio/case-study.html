<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Étude de cas - Enzo Domenger</title>
  <link rel="icon" type="image/x-icon" href="../assets/Logo_32_.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo(180).png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: url('../assets/cursor-cross.svg') 2 2, crosshair;
    }

    /* ── Back button ── */
    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    #back-btn:hover {
      background: rgba(0, 0, 0, 0.7);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateX(-3px);
    }
    #back-btn svg { flex-shrink: 0; }

    /* ── Hero ── */
    .hero {
      position: relative;
      width: 100%;
      min-height: 50vh;
      display: flex;
      align-items: flex-end;
      padding: 60px 8vw 48px;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%), #111;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: #111;
      z-index: 0;
    }
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 900px;
    }
    .hero-tag {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 56px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero-description {
      font-size: clamp(15px, 1.8vw, 18px);
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      max-width: 680px;
    }
    .hero-meta {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .meta-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    /* ── Content ── */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 8vw;
    }

    /* Video embed */
    .video-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 48px;
      background: #000;
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Gallery grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 48px;
    }
    .gallery-grid img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s ease;
    }
    .gallery-grid img:hover { transform: scale(1.02); }
    .gallery-grid img:nth-child(3) { grid-column: span 2; }

    /* Section blocks */
    .section {
      margin-bottom: 48px;
    }
    .section h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .section p {
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      line-height: 1.8;
      margin-bottom: 12px;
    }

    /* Skills pills */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .skill-pill {
      padding: 6px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }

    /* CV content */
    .cv-section { margin-bottom: 32px; }
    .cv-section h3 {
      font-size: 16px;
      font-weight: 700;
      color: rgba(168,211,238,1);
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(168,211,238,0.2);
    }
    .cv-item { margin-bottom: 18px; }
    .cv-item-title { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
    .cv-item-meta { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 6px; }
    .cv-item-desc { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.6; }

    /* Nav between projects */
    .project-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 16px;
      gap: 12px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 30px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .nav-btn:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.3);
    }
    .nav-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    .nav-btn-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }

    /* Loading state */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: rgba(255,255,255,0.5);
    }
    .loading-video {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    /* Fade in */
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .gallery-grid img:nth-child(3) { grid-column: span 1; }
      .project-nav { flex-direction: column; }
    }
  </style>
</head>
<body>

  <a id="back-btn" href="#"><!-- set dynamically -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Retour
  </a>

  <div id="app">
    <div id="loading">
      <video class="loading-video" src="../assets/Loading_animation_1.webm" autoplay loop muted playsinline></video>
    </div>
  </div>

  <script>
    const TOTAL_PROJECTS = 6;

    const projects = [
      {
        tag: 'CV',
        title: 'Enzo Domenger — Designer UI/UX',
        description: 'Designer créatif spécialisé en UI/UX avec une forte expertise en motion design et en 3D. Passionné par la création d\'expériences utilisateur immersives et l\'innovation en design interactif.',
        technologies: ['UI/UX Design', 'Motion Design', 'Three.js', 'WebGL'],
        type: 'cv'
      },
      {
        tag: 'Motion Design',
        title: 'Club Architecture — IA Générative',
        description: 'Cette vidéo illustre un projet de vulgarisation de la conception générative par l\'IA en architecture. Durant mon stage de cinq mois, j\'ai renforcé mes compétences en motion design, gestion de projet et narration visuelle, tout en apprenant à structurer et simplifier des concepts complexes.',
        technologies: ['After Effects', 'Premiere Pro', 'Illustrator', 'Blender', '3ds Max', 'Revit'],
        type: 'video',
        videoId: 'T1v0eDGNcOg'
      },
      {
        tag: 'Motion Design',
        title: 'But was it intelligent? — Garry Kasparov',
        description: 'Animation motion design avec bande sonore de la conférence TED de Garry Kasparov sur l\'intelligence artificielle. Création typographique et effets visuels explorant la relation homme-machine à travers l\'histoire de Deep Blue. Motion design narratif mêlant animation 2D et composition graphique.',
        technologies: ['After Effects', 'Premiere Pro', 'Illustrator', 'Photoshop'],
        type: 'video',
        videoId: 'F3rhjsh-SmQ'
      },
      {
        tag: 'Motion Design 3D',
        title: 'Angel Mugler — Parfum',
        description: 'Motion design sur le parfum Angel Mugler. J\'ai exploré les effets visuels et les dynamiques de mouvement, en jouant avec les matériaux, la lumière et la transparence pour sublimer les reflets du verre et créer une ambiance immersive.',
        technologies: ['Cinema 4D', 'After Effects', 'Premiere Pro'],
        type: 'video',
        videoId: 'X-lIDver-5k'
      },
      {
        tag: 'Vidéo',
        title: 'Comme tout le monde',
        description: 'J\'ai eu l\'opportunité de participer au FESTIVAL REGARDS CROISÉS en collaboration avec Margot Legrand et ESAT Les Ateliers De L\'Espoir. Notre film « Comme tout le monde » a été sélectionné en compétition dans la catégorie Milieu protégé et adapté.',
        technologies: ['Captation vidéo', 'Premiere Pro'],
        type: 'video',
        videoId: 'Yx5Jlxr_iuA'
      },
      {
        tag: 'Design Graphique',
        title: 'Autres Projets — Motion Design & Design Graphique',
        description: 'Collection de projets variés en motion design, illustration graphique et animation. Explorations créatives mêlant typographie animée, compositions visuelles et effets de transition. Projets personnels et expérimentations en design graphique et animation 2D/3D.',
        technologies: ['After Effects', 'Illustrator', 'Photoshop', 'Animation 2D/3D'],
        type: 'gallery',
        images: [
          './gallery/image1.webp',
          './gallery/image2.webp',
          './gallery/image3.webp',
          './gallery/image4.webp'
        ]
      }
    ];

    function getProjectIndex() {
      const params = new URLSearchParams(window.location.search);
      const idx = parseInt(params.get('projet'), 10);
      if (isNaN(idx) || idx < 0 || idx >= TOTAL_PROJECTS) return 0;
      return idx;
    }

    function buildCV() {
      return `
        <div class="cv-section">
          <h3>🎯 Profil</h3>
          <p>Designer créatif spécialisé en UI/UX avec une forte expertise en motion design et en 3D. Passionné par la création d'expériences utilisateur immersives et l'innovation en design interactif.</p>
        </div>
        <div class="cv-section">
          <h3>💼 Expérience</h3>
          <div class="cv-item">
            <div class="cv-item-title">Webdesigner — Stage</div>
            <div class="cv-item-meta">Agence Mekaa · Février 2026 – Avril 2026</div>
            <div class="cv-item-desc">Stage en webdesign au sein de l'agence Mekaa. Conception d'interfaces web, design graphique et expérience utilisateur.</div>
          </div>
          <div class="cv-item">
            <div class="cv-item-title">Designer UI/UX</div>
            <div class="cv-item-meta">Chez Léonard · Septembre 2025 – Mai 2026</div>
            <div class="cv-item-desc">Conception de sites internet, création d'affiches sur mesure et refonte de logos et d'identités visuelles.</div>
          </div>
          <div class="cv-item">
            <div class="cv-item-title">Motion Designer</div>
            <div class="cv-item-meta">Their Memory · Mai 2025 – Septembre 2025</div>
            <div class="cv-item-desc">Création de visuels graphiques pour la série documentaire Focus de guerre, diffusée sur YouTube.</div>
          </div>
          <div class="cv-item">
            <div class="cv-item-title">Motion Designer, Designer UI/UX & Infographiste 3D</div>
            <div class="cv-item-meta">Projets variés · 2021 – 2025</div>
            <div class="cv-item-desc">Projets diversifiés incluant jeux vidéos, captation vidéo (concerts) et montage vidéo.</div>
          </div>
        </div>
        <div class="cv-section">
          <h3>🎓 Formation</h3>
          <div class="cv-item">
            <div class="cv-item-title">Licence — Concepteur Designer UI</div>
            <div class="cv-item-meta">Greta CFA Est Bretagne · 2025 – 2026</div>
          </div>
          <div class="cv-item">
            <div class="cv-item-title">Licence — Animation, Technologie Interactive, Vidéographie et Effets Spéciaux</div>
            <div class="cv-item-meta">3axes Institut · 2021 – 2024</div>
          </div>
        </div>
        <div class="cv-section">
          <h3>🛠️ Compétences</h3>
          <div class="skills">
            <span class="skill-pill">UI/UX Design</span>
            <span class="skill-pill">Motion Design</span>
            <span class="skill-pill">Design Graphique</span>
            <span class="skill-pill">Infographie 3D</span>
            <span class="skill-pill">Figma</span>
            <span class="skill-pill">Wordpress</span>
            <span class="skill-pill">After Effects</span>
            <span class="skill-pill">Premiere Pro</span>
            <span class="skill-pill">Illustrator</span>
            <span class="skill-pill">Photoshop</span>
            <span class="skill-pill">Blender</span>
            <span class="skill-pill">Cinema 4D</span>
            <span class="skill-pill">Three.js</span>
            <span class="skill-pill">HTML/CSS/JS</span>
          </div>
        </div>
        <div class="cv-section">
          <h3>🏆 Réalisations</h3>
          <p>· Sélection au Festival Regards Croisés — Film "Comme tout le monde"</p>
          <p>· Portfolio 3D interactif avec Three.js et WebGL</p>
          <p>· Projets de motion design et création de jeux vidéos avec une équipe de 15 personnes</p>
        </div>
      `;
    }

    function buildMedia(project) {
      if (project.type === 'video') {
        return `
          <div class="video-wrap">
            <iframe
              src="https://www.youtube.com/embed/${project.videoId}"
              title="${project.title}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        `;
      }
      if (project.type === 'gallery') {
        const imgs = project.images.map((src, i) =>
          `<img src="${src}" alt="Image ${i + 1} — ${project.title}" loading="lazy">`
        ).join('');
        return `<div class="gallery-grid">${imgs}</div>`;
      }
      return '';
    }

    function render(idx) {
      const project = projects[idx];
      const prevIdx = idx - 1;
      const nextIdx = idx + 1;

      const mediaHTML = buildMedia(project);
      const bodyHTML = project.type === 'cv' ? buildCV() : `
        <div class="section">
          <h2>À propos du projet</h2>
          <p>${project.description}</p>
        </div>
        <div class="section">
          <h2>Technologies utilisées</h2>
          <div class="skills">
            ${project.technologies.map(t => `<span class="skill-pill">${t}</span>`).join('')}
          </div>
        </div>
      `;

      const chips = project.technologies.map(t =>
        `<span class="meta-chip">${t}</span>`
      ).join('');

      document.title = `${project.title} — Enzo Domenger`;

      document.getElementById('app').innerHTML = `
        <div class="fade-in">
          <div class="hero">
            <div class="hero-bg"></div>
            <div class="hero-content">
              <span class="hero-tag">${project.tag}</span>
              <h1>${project.title}</h1>
              <p class="hero-description">${project.description}</p>
              <div class="hero-meta">${chips}</div>
            </div>
          </div>

          <div class="content">
            ${mediaHTML}
            ${bodyHTML}

            <nav class="project-nav">
              <a href="?projet=${prevIdx}" class="nav-btn ${prevIdx < 0 ? 'disabled' : ''}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <div>
                  <div class="nav-btn-label">Précédent</div>
                  <div>${prevIdx >= 0 ? projects[prevIdx].title : '—'}</div>
                </div>
              </a>
              <a href="?projet=${nextIdx}" class="nav-btn ${nextIdx >= TOTAL_PROJECTS ? 'disabled' : ''}">
                <div style="text-align:right">
                  <div class="nav-btn-label">Suivant</div>
                  <div>${nextIdx < TOTAL_PROJECTS ? projects[nextIdx].title : '—'}</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </a>
            </nav>
          </div>
        </div>
      `;
    }

    const currentIdx = getProjectIndex();
    document.getElementById('back-btn').href = `./?projet=${currentIdx}`;
    render(currentIdx);
  </script>
</body>
</html>
